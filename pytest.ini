# pytest.ini
[pytest]
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: gated tests against a real Microsoft Graph tenant (FEAT-004); skip when navconfig credentials are absent.
    live: gated tests against other real external services; skip when required credentials/services are absent.
    real_llm: gated tests that call a real LLM provider; skip when required credentials are absent.
