name: Python package build and publish

on:
  release:
    types: [created]

jobs:
  build:
    name: Build pure-Python wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify pure-Python wheel
        shell: python
        run: |
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "no wheels were produced in dist/"
          for wheel in wheels:
              assert "none-any" in wheel.name, (
                  f"expected pure-Python wheel (none-any), got: {wheel.name}"
              )
              print(f"OK {wheel}")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/async-notify
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: List files in dist
        run: ls -l dist

      - name: Publish to PyPI
        run: |
          uv tool install twine
          uv tool run twine upload dist/* --username __token__ --password ${{ secrets.ASYNC_NOTIFY_PYPI_API_TOKEN }}
